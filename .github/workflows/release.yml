name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o cssh-mcp-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/cssh-mcp
          go build -o csshctl-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/csshctl

      - name: Package
        run: |
          tar czf cssh-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            cssh-mcp-${{ matrix.goos }}-${{ matrix.goarch }} \
            csshctl-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cssh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cssh-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: "cssh-*.tar.gz"
          generate_release_notes: true
